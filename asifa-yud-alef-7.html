<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>אסיפת הורים יא׳7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Varela+Round&display=swap" rel="stylesheet">
<style>
/* VOICE: חגיגי, חם ומזמין, כמו הזמנה צבעונית מבית הספר
   IDEA: לוח שעות בצורת מדבקות צבעוניות, כל שעה בצבע משלה
   PICTURE: כותרת שמש עם קונפטי ובלונים מצוירים
   COLOUR/TYPE: כתום-אלמוג, צהוב שמש וטורקיז; Fredoka לכותרות, Varela Round לגוף
   LAYOUT: עמודה אחת רגועה, כרטיסים מעוגלים מעל רקע מנוקד */
:root{color-scheme:light dark;
--bg:light-dark(#fff8ee,#17121f);--card:light-dark(#ffffff,#221b2e);--ink:light-dark(#2a1f3d,#f3eefb);--muted:light-dark(#6b5f7d,#b9aecb);
--brand:light-dark(#6c3fd1,#b79cff);--brand-ink:light-dark(#ffffff,#17121f);--soft:light-dark(#f3edff,#2e2540);--line:light-dark(#eadff5,#3a3050);
--mine:light-dark(#d9480f,#ffa66b);--mine-soft:light-dark(#fff1c2,#4a3516);--taken:light-dark(#f1eef4,#2a2433);--taken-ink:light-dark(#9a90a6,#7b7089);
--ok:light-dark(#13795b,#5fe0b0);--err:light-dark(#c0262d,#ff8f8f);
--h15:light-dark(#e8496a,#ff8aa3);--h16:light-dark(#e8590c,#ffa66b);--h17:light-dark(#b07d00,#ffd34d);--h18:light-dark(#2b8a3e,#69db7c);
--h19:light-dark(#0b8a8a,#4fd1c5);--h20:light-dark(#1c6fd1,#74b4ff);--h21:light-dark(#7b3fd1,#b79cff)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg) radial-gradient(light-dark(#f3dfc7,#2c2238) 1.2px,transparent 1.3px) 0 0/22px 22px;color:var(--ink);font:17px/1.6 "Varela Round",Arial,sans-serif;overflow-x:clip;padding-bottom:110px}
h1,h2,h3{font-family:Fredoka,"Varela Round",sans-serif;margin:0;line-height:1.1;text-wrap:balance}
.hero{position:relative;overflow:hidden;background:#ff6b4a;color:#fff;padding:clamp(30px,6vw,56px) max(5vw,18px) clamp(76px,11vw,100px)}
.hero::after{content:"";position:absolute;inset-inline:0;bottom:-1px;height:44px;background:var(--bg);clip-path:path("M0 30 Q 120 0 240 22 T 480 20 T 720 24 T 960 18 T 1200 26 T 1440 16 T 1680 24 T 1920 20 V44 H0Z")}
.hero .deco{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero .txt{position:relative;max-width:760px;margin:0 auto}
.hero .hi{display:inline-block;background:#ffd23f;color:#3a2200;font-family:Fredoka,sans-serif;font-weight:600;border-radius:999px;padding:4px 14px;font-size:16px;transform:rotate(-2deg);margin-bottom:10px}
.hero h1{font-size:clamp(40px,8vw,60px);font-weight:700;text-shadow:0 3px 0 rgba(120,30,10,.25)}
.hero .sub{font-size:20px;margin-top:8px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.chip{display:inline-flex;align-items:center;gap:7px;background:#fff;color:#7a2a12;border-radius:999px;padding:7px 15px;font-weight:600;white-space:nowrap;box-shadow:0 3px 0 rgba(120,30,10,.2)}
.chip svg{width:18px;height:18px;stroke:#ff6b4a}
main{max-width:760px;margin:-40px auto 0;padding:0 16px;display:grid;gap:20px;position:relative}
.card{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:clamp(18px,4vw,28px);box-shadow:0 8px 0 light-dark(#f1e3d3,#120e19)}
label.lbl{display:block;font-family:Fredoka,sans-serif;font-weight:600;font-size:18px;margin-bottom:8px}
.ro{position:relative}
.ro input{width:100%;font:inherit;font-family:Fredoka,sans-serif;font-size:22px;font-weight:600;padding:12px 52px 12px 14px;border-radius:16px;border:2px dashed light-dark(#c9b5f0,#5a4a7a);background:var(--soft);color:var(--ink);cursor:default}
.ro svg{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:22px;height:22px;stroke:var(--brand)}
.note{color:var(--muted);font-size:15px;margin:8px 0 0}
.status{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;align-items:center}
.status .badge{grid-row:span 2;width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:var(--soft)}
.status.done .badge{background:var(--mine-soft)}
.status .badge svg{width:36px;height:36px}
.status .body{grid-column:2}
.status .full{grid-column:1/-1}
.status h2{font-size:26px}
.bigtime{font-family:Fredoka,sans-serif;font-size:clamp(40px,10vw,58px);font-weight:700;color:var(--mine);direction:ltr;text-align:right;margin:4px 0 0;white-space:nowrap}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
button{font:inherit;cursor:pointer}
.btn{min-height:48px;padding:10px 22px;border-radius:999px;border:2px solid var(--brand);background:var(--brand);color:var(--brand-ink);font-family:Fredoka,sans-serif;font-weight:600;font-size:17px;box-shadow:0 4px 0 light-dark(#4a249e,#6d55a8);transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 light-dark(#4a249e,#6d55a8)}
.btn.ghost{background:var(--card);color:var(--brand);box-shadow:0 4px 0 var(--line)}
.btn.danger{border-color:var(--err);color:var(--err);background:var(--card);box-shadow:0 4px 0 var(--line)}
.btn:focus-visible,.slot:focus-visible,.tog input:focus-visible{outline:3px solid #ffd23f;outline-offset:3px}
.btn[disabled]{opacity:.6;cursor:wait}
.head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.head h2{font-size:26px}
.count{font-family:Fredoka,sans-serif;font-weight:600;background:light-dark(#e6fcf5,#173a30);color:var(--ok);border-radius:999px;padding:5px 14px;white-space:nowrap}
.tools{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:12px 0 4px}
.tog{display:flex;align-items:center;gap:8px;min-height:44px;cursor:pointer;font-weight:600}
.tog input{width:22px;height:22px;accent-color:var(--brand)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:14px;color:var(--muted)}
.legend i{display:inline-block;width:16px;height:16px;border-radius:6px;vertical-align:-3px;margin-left:5px;border:2px solid var(--line)}
.hour{margin-top:18px}
.hour h3{display:inline-flex;align-items:center;gap:8px;font-size:16px;font-weight:600;color:var(--c);margin:0 0 10px}
.hour h3::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--c)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px}
.slot{position:relative;min-height:56px;border-radius:18px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 10%,var(--card));color:var(--c);font-family:Fredoka,sans-serif;font-weight:600;font-size:19px;direction:ltr;white-space:nowrap;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 35%,transparent);transition:transform .15s,box-shadow .15s,background .15s}
.slot:hover{transform:translateY(-3px) rotate(-1deg);box-shadow:0 7px 0 color-mix(in srgb,var(--c) 35%,transparent)}
.slot.sel{background:var(--c);color:light-dark(#fff,#17121f);animation:pop .35s}
.slot.mine{border-color:var(--mine);background:var(--mine-soft);color:var(--mine);box-shadow:0 4px 0 color-mix(in srgb,var(--mine) 40%,transparent)}
.slot.mine::after{content:"";position:absolute;top:-9px;left:-9px;width:24px;height:24px;background:#ffd23f;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.slot.taken{border:2px dashed var(--line);background:var(--taken);color:var(--taken-ink);text-decoration:line-through;cursor:not-allowed;box-shadow:none;transform:none}
.slot small{display:block;font-family:"Varela Round",sans-serif;font-size:12px;font-weight:400;text-decoration:none;direction:rtl}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.empty{color:var(--muted);padding:12px 0}
.bar{position:fixed;inset-inline:0;bottom:0;z-index:5;background:var(--card);border-top:3px solid #ffd23f;box-shadow:0 -8px 24px rgba(40,20,60,.12);padding:14px max(4vw,16px) calc(14px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;transform:translateY(110%);transition:transform .25s cubic-bezier(.3,1.4,.6,1)}
.bar.on{transform:none}
.bar b{font-family:Fredoka,sans-serif;font-size:24px;color:var(--mine);direction:ltr;display:inline-block}
.msg{border-radius:16px;padding:12px 16px;font-weight:600;margin-top:4px}
.msg.ok{background:light-dark(#e6fcf5,#173a30);color:var(--ok)}
.msg.err{background:light-dark(#fff0f0,#3d1d22);color:var(--err)}
.hide{display:none!important}
table{width:100%;border-collapse:collapse;font-size:16px}
th,td{text-align:right;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:Fredoka,sans-serif}
td.t{direction:ltr;text-align:right;white-space:nowrap;font-family:Fredoka,sans-serif;font-weight:600;width:120px}
td.free{color:var(--muted)}
.links td{word-break:break-all}
.links .lnk{font-size:13px;color:var(--muted);direction:ltr;text-align:right}
.mini{min-height:40px;padding:6px 14px;font-size:15px}
footer{text-align:center;color:var(--muted);font-size:15px;margin:28px 0}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:9;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.8}}
@media (prefers-reduced-motion:reduce){.bar,.slot,.btn{transition:none}.slot.sel{animation:none}.confetti{display:none}}
</style>
</head>
<body>
<header class="hero">
  <svg class="deco" viewBox="0 0 400 220" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g opacity=".9">
      <circle cx="30" cy="40" r="5" fill="#ffd23f"/><circle cx="360" cy="30" r="6" fill="#fff"/><circle cx="300" cy="150" r="4" fill="#ffd23f"/>
      <circle cx="120" cy="190" r="5" fill="#fff" opacity=".7"/><circle cx="210" cy="25" r="3.5" fill="#7ee0d3"/><circle cx="385" cy="120" r="4" fill="#7ee0d3"/>
      <rect x="70" y="20" width="10" height="6" rx="2" fill="#7ee0d3" transform="rotate(30 75 23)"/>
      <rect x="250" y="90" width="11" height="6" rx="2" fill="#fff" transform="rotate(-25 255 93)"/>
      <rect x="160" y="140" width="10" height="6" rx="2" fill="#ffd23f" transform="rotate(50 165 143)"/>
      <rect x="335" y="75" width="10" height="6" rx="2" fill="#ffd23f" transform="rotate(-40 340 78)"/>
      <path d="M15 120 q8 -8 16 0 t16 0" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".7"/>
      <path d="M270 190 q8 -8 16 0 t16 0" stroke="#ffd23f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>
    <g transform="translate(40 70)">
      <path d="M0 40 q2 30 -6 60" stroke="#fff" stroke-width="1.2" fill="none" opacity=".8"/>
      <ellipse cx="0" cy="20" rx="17" ry="21" fill="#ffd23f"/><ellipse cx="-6" cy="12" rx="4" ry="7" fill="#fff" opacity=".55"/>
      <path d="M-3 40 h6 l-3 5z" fill="#ffd23f"/>
    </g>
    <g transform="translate(70 95) rotate(-12)">
      <path d="M0 40 q-4 26 6 55" stroke="#fff" stroke-width="1.2" fill="none" opacity=".8"/>
      <ellipse cx="0" cy="20" rx="14" ry="18" fill="#7ee0d3"/><ellipse cx="-5" cy="13" rx="3.5" ry="6" fill="#fff" opacity=".55"/>
      <path d="M-3 37 h6 l-3 5z" fill="#7ee0d3"/>
    </g>
  </svg>
  <div class="txt">
    <span class="hi">מחכים לראות אתכם!</span>
    <h1>אסיפת הורים</h1>
    <div class="sub">כיתה יא׳7 · תיכון בן גוריון</div>
    <div class="chips">
      <span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>יום רביעי, 2.12</span>
      <span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>15:30 עד 21:30</span>
      <span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 20v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M21 20v-2a4 4 0 0 0-3-3.9"/></svg>פגישה של 10 דקות</span>
    </div>
  </div>
</header>

<main id="app">
  <section class="card" id="loading"><p>טוען נתונים...</p></section>
</main>

<div class="bar" id="bar" role="region" aria-label="אישור שעה">
  <div>השעה שבחרתם: <b id="barTime"></b></div>
  <div class="row" style="margin:0">
    <button class="btn" id="barOk" type="button">אישור הפגישה</button>
    <button class="btn ghost" id="barCancel" type="button">ביטול</button>
  </div>
</div>

<footer>לשאלות ניתן לפנות למחנכת הכיתה</footer>

<script>
{
// ===== הגדרות =====
const SUPABASE_URL = 'https://lwlvjpivnlhchvmhkyhy.supabase.co';
const SUPABASE_KEY = 'sb_publishable_5EPchQmGY_C7lfI3UCyy8w_PC_PHYc4';
const START_MIN = 15 * 60 + 30, SLOT_LEN = 10, SLOT_COUNT = 36;
const REFRESH_MS = 20000;

const params = new URLSearchParams(location.search);
const token = (params.get('s') || '').trim();
const adminKey = (params.get('admin') || '').trim();
const app = document.getElementById('app');
const bar = document.getElementById('bar');

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const fmt = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
const toMin = t => { const [h, m] = String(t).split(':').map(Number); return h * 60 + m; };
const range = m => fmt(m) + '-' + fmt(m + SLOT_LEN);
const SLOTS = Array.from({length: SLOT_COUNT}, (_, i) => START_MIN + i * SLOT_LEN);

async function rpc(fn, args) {
  const headers = {'Content-Type': 'application/json', apikey: SUPABASE_KEY};
  if (SUPABASE_KEY.startsWith('eyJ')) headers.Authorization = 'Bearer ' + SUPABASE_KEY;
  const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {method: 'POST', headers, body: JSON.stringify(args || {})});
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

function errorCard(title, text, retry) {
  app.innerHTML = '<section class="card"><h2 style="font-size:24px">' + esc(title) + '</h2><p>' + esc(text) + '</p>' +
    (retry ? '<button class="btn" type="button" id="retry">ניסיון נוסף</button>' : '') + '</section>';
  if (retry) document.getElementById('retry').onclick = () => location.reload();
}

// ===== תצוגת הורים =====
const state = {name: '', mine: null, taken: new Set(), selected: null, freeOnly: false, busy: false, msg: null};

async function loadParent(first) {
  try {
    const [stu, taken] = await Promise.all([rpc('pm_get_student', {p_token: token}), rpc('pm_taken_slots')]);
    if (!stu.length) { errorCard('הקישור אינו תקף', 'לא נמצא תלמיד המשויך לקישור זה. נא לפנות למחנכת הכיתה לקבלת הקישור האישי.'); return false; }
    state.name = stu[0].name;
    state.mine = stu[0].slot ? toMin(stu[0].slot) : null;
    state.taken = new Set(taken.map(x => toMin(typeof x === 'string' ? x : x.pm_taken_slots)));
    if (state.selected !== null && state.taken.has(state.selected) && state.selected !== state.mine) state.selected = null;
    renderParent();
    return true;
  } catch (e) {
    if (first) errorCard('לא ניתן לטעון את הנתונים', 'ייתכן שיש בעיית חיבור לאינטרנט. נסו שוב בעוד רגע.', true);
    return false;
  }
}

function renderParent() {
  const free = SLOTS.filter(m => !state.taken.has(m)).length;
  const lock = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
  const star = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z" fill="#ffd23f" stroke="#e8590c" stroke-width="1.4" stroke-linejoin="round"/></svg>';
  const clock = '<svg viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>';
  const status = state.mine !== null
    ? '<div class="badge">' + star + '</div><div class="body"><h2>נרשמתם לאסיפה</h2><div class="bigtime">' + range(state.mine) + '</div></div><p class="note full" style="margin:0">ניתן לבחור שעה אחרת מהרשימה למטה, והשעה תתעדכן.</p>' +
      '<div class="row full"><button class="btn ghost" type="button" id="goPick">שינוי שעה</button><button class="btn danger" type="button" id="cancelBtn">ביטול ההרשמה</button></div>' +
      '<div id="cancelAsk" class="hide msg err full">לבטל את הפגישה בשעה ' + range(state.mine) + '? <div class="row"><button class="btn danger mini" type="button" id="cancelYes">כן, לבטל</button><button class="btn ghost mini" type="button" id="cancelNo">לא</button></div></div>'
    : '<div class="badge">' + clock + '</div><div class="body"><h2>עוד לא נקבעה שעה</h2><p class="note" style="font-size:17px;margin:4px 0 0">בחרו שעה פנויה מהרשימה למטה ואשרו.</p></div>';
  const msg = state.msg ? '<div class="msg full ' + state.msg.kind + '" role="status">' + esc(state.msg.text) + '</div>' : '';

  const hours = {};
  for (const m of SLOTS) (hours[Math.floor(m / 60)] ||= []).push(m);
  let grid = '';
  for (const h of Object.keys(hours)) {
    const list = hours[h].filter(m => !state.freeOnly || !state.taken.has(m) || m === state.mine);
    if (!list.length) continue;
    grid += '<div class="hour" style="--c:var(--h' + h + ')"><h3>' + pad(h) + ':00</h3><div class="grid">' + list.map(m => {
      const mine = m === state.mine, taken = state.taken.has(m) && !mine, sel = m === state.selected;
      const cls = 'slot' + (mine ? ' mine' : '') + (taken ? ' taken' : '') + (sel ? ' sel' : '');
      const sr = mine ? 'השעה שלכם' : taken ? 'תפוס' : 'פנוי';
      return '<button type="button" class="' + cls + '" data-m="' + m + '"' + (taken ? ' disabled' : '') + ' aria-pressed="' + sel + '" aria-label="' + range(m) + ', ' + sr + '">' +
        fmt(m) + (mine ? '<small>השעה שלכם</small>' : taken ? '<small>תפוס</small>' : '') + '</button>';
    }).join('') + '</div></div>';
  }
  if (!grid) grid = '<p class="empty">אין כרגע שעות פנויות.</p>';

  app.innerHTML =
    '<section class="card"><label class="lbl" for="stName">שם התלמיד/ה</label><div class="ro"><input id="stName" type="text" readonly aria-readonly="true" value="' + esc(state.name) + '">' + lock + '</div>' +
    '<p class="note">הקישור אישי ומותאם מראש, ולכן לא ניתן לשנות את השם.</p></section>' +
    '<section class="card status' + (state.mine !== null ? ' done' : '') + '">' + status + msg + '</section>' +
    '<section class="card" id="pick"><div class="head"><h2>' + (state.mine !== null ? 'החלפת שעה' : 'בחירת שעה') + '</h2><span class="count">' + free + ' מתוך ' + SLOT_COUNT + ' שעות פנויות</span></div>' +
    '<div class="tools"><label class="tog"><input type="checkbox" id="freeOnly"' + (state.freeOnly ? ' checked' : '') + '> הצגת שעות פנויות בלבד</label>' +
    '<div class="legend"><span><i style="background:var(--soft);border-color:var(--h19)"></i>פנוי</span><span><i style="background:var(--taken)"></i>תפוס</span><span><i style="background:var(--mine-soft);border-color:var(--mine)"></i>השעה שלכם</span></div></div>' +
    grid + '</section>';

  app.querySelectorAll('.slot:not([disabled])').forEach(b => b.onclick = () => {
    const m = +b.dataset.m;
    if (m === state.mine) return;
    state.selected = state.selected === m ? null : m;
    state.msg = null;
    renderParent();
  });
  document.getElementById('freeOnly').onchange = e => { state.freeOnly = e.target.checked; renderParent(); };
  const goPick = document.getElementById('goPick');
  if (goPick) goPick.onclick = () => document.getElementById('pick').scrollIntoView({behavior: 'smooth'});
  const cb = document.getElementById('cancelBtn');
  if (cb) {
    cb.onclick = () => document.getElementById('cancelAsk').classList.remove('hide');
    document.getElementById('cancelNo').onclick = () => document.getElementById('cancelAsk').classList.add('hide');
    document.getElementById('cancelYes').onclick = doCancel;
  }
  updateBar();
}

function updateBar() {
  if (state.selected === null) { bar.classList.remove('on'); return; }
  document.getElementById('barTime').textContent = range(state.selected);
  document.getElementById('barOk').textContent = state.mine !== null ? 'עדכון השעה' : 'אישור הפגישה';
  bar.classList.add('on');
}

function confetti() {
  const box = document.createElement('div'); box.className = 'confetti';
  const cols = ['#ff6b4a', '#ffd23f', '#4fd1c5', '#6c3fd1', '#e8496a', '#74b4ff'];
  for (let i = 0; i < 60; i++) {
    const c = document.createElement('i');
    c.style.left = Math.random() * 100 + '%';
    c.style.background = cols[i % cols.length];
    c.style.animationDelay = Math.random() * 0.5 + 's';
    c.style.animationDuration = 1.4 + Math.random() * 1.2 + 's';
    box.appendChild(c);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 3200);
}

async function doBook() {
  if (state.busy || state.selected === null) return;
  state.busy = true;
  const ok = document.getElementById('barOk'); ok.disabled = true;
  const m = state.selected, changed = state.mine !== null;
  try {
    const res = await rpc('pm_book', {p_token: token, p_slot: fmt(m)});
    if (res.ok) {
      state.selected = null;
      confetti();
      state.msg = {kind: 'ok', text: (changed ? 'השעה עודכנה ל־' : 'הפגישה נקבעה לשעה ') + range(m) + '. נתראה ביום רביעי, 2.12.'};
    } else if (res.error === 'taken') {
      state.selected = null;
      state.msg = {kind: 'err', text: 'השעה ' + fmt(m) + ' נתפסה ממש עכשיו על ידי הורים אחרים. נא לבחור שעה אחרת.'};
    } else {
      state.msg = {kind: 'err', text: 'לא ניתן לשמור את השעה. נא לפנות למחנכת הכיתה.'};
    }
  } catch (e) {
    state.msg = {kind: 'err', text: 'השמירה לא הצליחה בגלל בעיית חיבור. נסו שוב.'};
  }
  state.busy = false; ok.disabled = false;
  await loadParent(false);
  window.scrollTo({top: 0, behavior: 'smooth'});
}

async function doCancel() {
  if (state.busy) return;
  state.busy = true;
  try {
    await rpc('pm_cancel', {p_token: token});
    state.msg = {kind: 'ok', text: 'ההרשמה בוטלה. ניתן לבחור שעה חדשה בכל עת.'};
  } catch (e) {
    state.msg = {kind: 'err', text: 'הביטול לא הצליח בגלל בעיית חיבור. נסו שוב.'};
  }
  state.busy = false;
  await loadParent(false);
}

document.getElementById('barOk').onclick = doBook;
document.getElementById('barCancel').onclick = () => { state.selected = null; renderParent(); };

// ===== תצוגת מורה =====
async function loadAdmin() {
  let d;
  try { d = await rpc('pm_admin', {p_key: adminKey}); }
  catch (e) { errorCard('לא ניתן לטעון את הנתונים', 'בדקי את החיבור לאינטרנט.', true); return; }
  if (!d.ok) { errorCard('אין הרשאה', 'מפתח המורה אינו תקף.'); return; }
  const base = location.origin + location.pathname + '?s=';
  const booked = d.students.filter(s => s.slot).length;
  const missing = d.students.filter(s => !s.slot);
  app.innerHTML =
    '<section class="card"><div class="head"><h2>לוח הפגישות</h2><span class="count">' + booked + ' מתוך ' + d.students.length + ' נרשמו</span></div>' +
    '<div class="row"><button class="btn ghost mini" type="button" id="refresh">רענון</button></div>' +
    '<table><thead><tr><th>שעה</th><th>תלמיד/ה</th></tr></thead><tbody>' +
    d.schedule.map(r => '<tr><td class="t">' + range(toMin(r.slot)) + '</td>' + (r.name ? '<td>' + esc(r.name) + '</td>' : '<td class="free">פנוי</td>') + '</tr>').join('') +
    '</tbody></table></section>' +
    '<section class="card"><h2 style="font-size:24px">טרם נרשמו (' + missing.length + ')</h2>' +
    (missing.length ? '<p>' + missing.map(s => esc(s.name)).join(', ') + '</p>' : '<p class="note">כל התלמידים נרשמו.</p>') + '</section>' +
    '<section class="card"><div class="head"><h2>קישורים אישיים</h2><button class="btn mini" type="button" id="copyAll">העתקת כל הקישורים</button></div>' +
    '<table class="links"><tbody>' + d.students.map((s, i) =>
      '<tr><td><b>' + esc(s.name) + '</b><div class="lnk">' + esc(base + s.token) + '</div></td><td style="width:90px"><button class="btn ghost mini" type="button" data-i="' + i + '">העתקה</button></td></tr>').join('') +
    '</tbody></table><div id="copied" class="msg ok hide" role="status">הועתק</div></section>';
  const copied = document.getElementById('copied');
  const copy = async txt => {
    try { await navigator.clipboard.writeText(txt); copied.classList.remove('hide'); setTimeout(() => copied.classList.add('hide'), 1800); }
    catch (e) { copied.textContent = 'ההעתקה נחסמה בדפדפן. ניתן לסמן ולהעתיק ידנית.'; copied.classList.remove('hide'); }
  };
  app.querySelectorAll('[data-i]').forEach(b => b.onclick = () => {
    const s = d.students[+b.dataset.i];
    copy('שלום, זהו הקישור האישי לרישום לאסיפת ההורים של ' + s.name + ' (יא׳7, יום רביעי 2.12):\n' + base + s.token);
  });
  document.getElementById('copyAll').onclick = () => copy(d.students.map(s => s.name + ': ' + base + s.token).join('\n'));
  document.getElementById('refresh').onclick = loadAdmin;
}

// ===== הפעלה =====
if (adminKey) {
  document.title = 'לוח אסיפת הורים יא׳7';
  loadAdmin();
} else if (!token) {
  errorCard('יש לפתוח את הקישור האישי', 'לכל תלמיד/ה נשלח קישור אישי לרישום. נא לפתוח את הקישור המלא שקיבלתם.');
} else {
  loadParent(true).then(ok => {
    if (!ok) return;
    const timer = setInterval(() => { if (!document.hidden && !state.busy) loadParent(false); }, REFRESH_MS);
    document.addEventListener('visibilitychange', () => { if (!document.hidden && !state.busy) loadParent(false); });
  });
}
}
</script>
</body>
</html>
